packages:
  - apps/*
  - packages/*

allowBuilds:
  "@tailwindcss/oxide": true
  aws-crt: true
  aws-sdk: false
  esbuild: false
  pnpm: true
  sharp: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nitro-nightly

catalog:
  eslint: 9.37.0
  pino: 9.7.0
  prettier: 3.6.0
  sst: 4.14.1
  typescript: 5.9.2
  zod: 4.6.7

catalogs:
