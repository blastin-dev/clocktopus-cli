    date-fns-tz: 3.2.0
  node:
    "@types/node": 22.15.3
  pino:
    pino: 9.7.0
    pino-pretty: 13.1.1
  react19:
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    react: 19.2.6
    react-dom: 19.2.6
  vitest:
    "@vitest/ui": ^4.1.12
    vitest: ^4.1.12

linkWorkspacePackages: true

nodeLinker: hoisted

