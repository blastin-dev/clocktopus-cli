packages:
  - apps/*
  - packages/*

allowBuilds:
  "@tailwindcss/oxide": true
  aws-crt: true
  aws-sdk: false
  esbuild: false
  pnpm: true
  protobufjs: true
  sharp: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nitro-nightly

catalog:
  eslint: 9.37.0
  pino: 9.7.0
  prettier: 3.6.0
  sst: 4.14.1
  typescript: 5.9.2
  zod: 4.4.3

catalogs:
  date-fns:
    date-fns: 4.1.0
    date-fns-tz: 3.2.0
  node:
    "@types/node": 22.15.3
  pino:
    pino: 9.7.0
    pino-pretty: 13.1.1
  react19:
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    react: 19.2.6
    react-dom: 19.2.6
  vitest:
    "@vitest/ui": ^4.1.5
    vitest: ^4.1.5

linkWorkspacePackages: true

nodeLinker: hoisted

overrides:
  crossws>srvx: 1.0.3
  protobufjs: ">=7.5.5"
  defu: ">=6.1.5"
  undici: ">=7.24.0"
  seroval: ">=1.6.7"
  minimatch: ">=9.0.7"
  picomatch: ">=4.0.4"
  rollup: ">=4.59.0"
  flatted: ">=3.4.2"
  esbuild: ">=0.25.0"
  "ajv@<6.14.0": ^6.14.0
  "ajv@>=8.0.0 <8.18.0": ^8.18.0
  protocol-buffers-schema: ">=3.6.1"
  postcss: ">=8.5.10"
  diff: ">=8.0.3"
  tar: ">=7.5.13"
  kysely: 0.28.17
  follow-redirects: ">=1.16.0"
  drizzle-orm: 0.44.6
  hono: ">=4.12.4"
  "@modelcontextprotocol/sdk": ">=1.25.2"
  path-to-regexp: ">=8.4.0"
  vite: ^7.3.2
  qs: ">=6.14.2"
  shell-quote: ">=1.8.4"
  nodemailer: ">=8.0.5"
  uuid: ">=14.0.0"
  js-yaml: ">=4.1.1"
  "@conform-to/react": 1.12.0
  "@conform-to/zod": 1.12.0
  better-auth: 1.6.13
